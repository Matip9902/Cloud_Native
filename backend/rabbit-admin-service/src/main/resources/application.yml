server:
  port: ${RABBIT_ADMIN_SERVICE_PORT:8084}

spring:
  application:
    name: rabbit-admin-service
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:cloudnative}
    password: ${RABBITMQ_PASSWORD:cloudnative123}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
