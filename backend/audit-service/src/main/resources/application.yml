server:
  port: ${AUDIT_SERVICE_PORT:8088}
spring:
  application:
    name: audit-service
  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672}
    username: ${RABBITMQ_USERNAME:cloudnative}
    password: ${RABBITMQ_PASSWORD:cloudnative123}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
  datasource:
    url: ${AUDIT_DB_URL:jdbc:h2:file:./data/audit}
    username: ${AUDIT_DB_USERNAME:sa}
    password: ${AUDIT_DB_PASSWORD:}
    driver-class-name: ${AUDIT_DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
app:
  messaging:
    product-events-exchange: ${PRODUCT_EVENTS_EXCHANGE:product.events.exchange}
    product-audit-queue: ${PRODUCT_AUDIT_QUEUE:product.audit.queue}
    product-audit-binding-key: ${PRODUCT_AUDIT_BINDING_KEY:product.#}
    product-audit-dlx: ${PRODUCT_AUDIT_DLX:product.audit.dlx}
    product-audit-dlq: ${PRODUCT_AUDIT_DLQ:product.audit.dlq}
    product-audit-dead-routing-key: ${PRODUCT_AUDIT_DEAD_ROUTING_KEY:product.audit.dead}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
