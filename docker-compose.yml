services:
  rabbitmq:
    image: rabbitmq:4.2-management
    container_name: rabbitmq-1
    hostname: rabbitmq-1
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-cloudnative}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-cloudnative123}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-cloudnative-local-cluster-cookie}
      RABBITMQ_NODENAME: rabbit@rabbitmq-1
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_node1_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq-2:
    image: rabbitmq:4.2-management
    container_name: rabbitmq-2
    hostname: rabbitmq-2
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-cloudnative}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-cloudnative123}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-cloudnative-local-cluster-cookie}
      RABBITMQ_NODENAME: rabbit@rabbitmq-2
    post_start:
      - command: >-
          bash -c "sleep 8 &&
          rabbitmqctl await_startup &&
          rabbitmqctl stop_app &&
          rabbitmqctl reset &&
          rabbitmqctl join_cluster rabbit@rabbitmq-1 &&
          rabbitmqctl start_app"
        user: rabbitmq
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - rabbitmq_node2_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  eureka-server:
    build:
      context: ./backend/eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"

  inventory-service:
    build:
      context: ./backend/inventory-service
    container_name: inventory-service
    depends_on:
      eureka-server:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      rabbitmq-2:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      CORS_ALLOWED_ORIGINS: http://localhost:4200
      JWT_ISSUER_URI: https://login.microsoftonline.com/94b15b07-9bad-4661-8554-aad0e62b18de/v2.0
      JWT_AUDIENCES: api://0f18b5b0-285b-4050-a959-245884ab7670,0f18b5b0-285b-4050-a959-245884ab7670
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_ADDRESSES: rabbitmq:5672,rabbitmq-2:5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-cloudnative}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-cloudnative123}
    ports:
      - "8080:8080"

  customer-service:
    build:
      context: ./backend/customer-service
    container_name: customer-service
    depends_on:
      - eureka-server
    environment:
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      CORS_ALLOWED_ORIGINS: http://localhost:4200
      JWT_ISSUER_URI: https://login.microsoftonline.com/94b15b07-9bad-4661-8554-aad0e62b18de/v2.0
      JWT_AUDIENCES: api://0f18b5b0-285b-4050-a959-245884ab7670,0f18b5b0-285b-4050-a959-245884ab7670
    ports:
      - "8081:8081"

  supplier-service:
    build:
      context: ./backend/supplier-service
    container_name: supplier-service
    depends_on:
      - eureka-server
    environment:
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      CORS_ALLOWED_ORIGINS: http://localhost:4200
      JWT_ISSUER_URI: https://login.microsoftonline.com/94b15b07-9bad-4661-8554-aad0e62b18de/v2.0
      JWT_AUDIENCES: api://0f18b5b0-285b-4050-a959-245884ab7670,0f18b5b0-285b-4050-a959-245884ab7670
    ports:
      - "8082:8082"

  notification-service:
    build:
      context: ./backend/notification-service
    container_name: notification-service
    depends_on:
      eureka-server:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      rabbitmq-2:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      CORS_ALLOWED_ORIGINS: http://localhost:4200
      JWT_ISSUER_URI: https://login.microsoftonline.com/94b15b07-9bad-4661-8554-aad0e62b18de/v2.0
      JWT_AUDIENCES: api://0f18b5b0-285b-4050-a959-245884ab7670,0f18b5b0-285b-4050-a959-245884ab7670
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_ADDRESSES: rabbitmq:5672,rabbitmq-2:5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-cloudnative}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-cloudnative123}
    ports:
      - "8083:8083"

  rabbit-admin-service:
    build:
      context: ./backend/rabbit-admin-service
    container_name: rabbit-admin-service
    depends_on:
      eureka-server:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      rabbitmq-2:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_ADDRESSES: rabbitmq:5672,rabbitmq-2:5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-cloudnative}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-cloudnative123}
    ports:
      - "8084:8084"

  api-gateway:
    build:
      context: ./backend/api-gateway
    container_name: api-gateway
    depends_on:
      - eureka-server
      - inventory-service
      - customer-service
      - supplier-service
      - notification-service
    environment:
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      CORS_ALLOWED_ORIGINS: http://localhost:4200
      JWT_ISSUER_URI: https://login.microsoftonline.com/94b15b07-9bad-4661-8554-aad0e62b18de/v2.0
      JWT_AUDIENCES: api://0f18b5b0-285b-4050-a959-245884ab7670,0f18b5b0-285b-4050-a959-245884ab7670
    ports:
      - "8085:8085"

  frontend:
    build:
      context: ./frontend/angular-app-cloud
    container_name: angular-app-cloud
    depends_on:
      - api-gateway
    ports:
      - "4200:80"

volumes:
  rabbitmq_node1_data:
  rabbitmq_node2_data:
