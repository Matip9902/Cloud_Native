services:
  eureka-server:
    build:
      context: ./backend/eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"

  api-gateway:
    build:
      context: ./backend/api-gateway
    container_name: api-gateway
    depends_on:
      - eureka-server
    environment:
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:-https://login.microsoftonline.com/94b15b07-9bad-4661-8554-aad0e62b18de/v2.0}
      JWT_AUDIENCES: ${JWT_AUDIENCES:-api://0f18b5b0-285b-4050-a959-245884ab7670,0f18b5b0-285b-4050-a959-245884ab7670}
    ports:
      - "8085:8085"

  frontend:
    build:
      context: ./frontend/angular-app-cloud
    container_name: angular-app-cloud
    depends_on:
      - api-gateway
    ports:
      - "4200:80"
