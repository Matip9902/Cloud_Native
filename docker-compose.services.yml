services:
  rabbitmq:
    image: rabbitmq:4.2-management
    container_name: rabbitmq-1
    hostname: rabbitmq-1
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-cloudnative}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-cloudnative123}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-cloudnative-cluster-cookie}
      RABBITMQ_NODENAME: rabbit@rabbitmq-1
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_node1_data:/var/lib/rabbitmq

  rabbitmq-2:
    image: rabbitmq:4.2-management
    container_name: rabbitmq-2
    hostname: rabbitmq-2
    depends_on:
      - rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-cloudnative}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-cloudnative123}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-cloudnative-cluster-cookie}
      RABBITMQ_NODENAME: rabbit@rabbitmq-2
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - rabbitmq_node2_data:/var/lib/rabbitmq

  inventory-service:
    build:
      context: ./backend/inventory-service
    container_name: inventory-service
    environment:
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE}
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      EUREKA_INSTANCE_IP_ADDRESS: ${SERVICES_EC2_PRIVATE_IP}
      EUREKA_INSTANCE_NON_SECURE_PORT: 8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:-https://login.microsoftonline.com/94b15b07-9bad-4661-8554-aad0e62b18de/v2.0}
      JWT_AUDIENCES: ${JWT_AUDIENCES:-api://0f18b5b0-285b-4050-a959-245884ab7670,0f18b5b0-285b-4050-a959-245884ab7670}
      DB_URL: ${RDS_JDBC_URL:-jdbc:h2:mem:inventorydb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
      DB_USERNAME: ${RDS_USERNAME:-sa}
      DB_PASSWORD: ${RDS_PASSWORD:-}
      DB_DRIVER: ${RDS_DRIVER:-org.h2.Driver}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      RABBITMQ_ADDRESSES: rabbitmq:5672,rabbitmq-2:5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-cloudnative}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-cloudnative123}
    ports:
      - "8080:8080"

  customer-service:
    build:
      context: ./backend/customer-service
    container_name: customer-service
    environment:
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE}
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      EUREKA_INSTANCE_IP_ADDRESS: ${SERVICES_EC2_PRIVATE_IP}
      EUREKA_INSTANCE_NON_SECURE_PORT: 8081
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:-https://login.microsoftonline.com/94b15b07-9bad-4661-8554-aad0e62b18de/v2.0}
      JWT_AUDIENCES: ${JWT_AUDIENCES:-api://0f18b5b0-285b-4050-a959-245884ab7670,0f18b5b0-285b-4050-a959-245884ab7670}
      CUSTOMER_DB_URL: ${RDS_JDBC_URL:-jdbc:h2:mem:customerdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
      CUSTOMER_DB_USERNAME: ${RDS_USERNAME:-sa}
      CUSTOMER_DB_PASSWORD: ${RDS_PASSWORD:-}
      CUSTOMER_DB_DRIVER: ${RDS_DRIVER:-org.h2.Driver}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
    ports:
      - "8081:8081"

  supplier-service:
    build:
      context: ./backend/supplier-service
    container_name: supplier-service
    environment:
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE}
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      EUREKA_INSTANCE_IP_ADDRESS: ${SERVICES_EC2_PRIVATE_IP}
      EUREKA_INSTANCE_NON_SECURE_PORT: 8082
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:-https://login.microsoftonline.com/94b15b07-9bad-4661-8554-aad0e62b18de/v2.0}
      JWT_AUDIENCES: ${JWT_AUDIENCES:-api://0f18b5b0-285b-4050-a959-245884ab7670,0f18b5b0-285b-4050-a959-245884ab7670}
      SUPPLIER_DB_URL: ${RDS_JDBC_URL:-jdbc:h2:mem:supplierdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
      SUPPLIER_DB_USERNAME: ${RDS_USERNAME:-sa}
      SUPPLIER_DB_PASSWORD: ${RDS_PASSWORD:-}
      SUPPLIER_DB_DRIVER: ${RDS_DRIVER:-org.h2.Driver}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
    ports:
      - "8082:8082"

  notification-service:
    build:
      context: ./backend/notification-service
    container_name: notification-service
    environment:
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE}
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      EUREKA_INSTANCE_IP_ADDRESS: ${SERVICES_EC2_PRIVATE_IP}
      EUREKA_INSTANCE_NON_SECURE_PORT: 8083
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:-https://login.microsoftonline.com/94b15b07-9bad-4661-8554-aad0e62b18de/v2.0}
      JWT_AUDIENCES: ${JWT_AUDIENCES:-api://0f18b5b0-285b-4050-a959-245884ab7670,0f18b5b0-285b-4050-a959-245884ab7670}
      NOTIFICATION_DB_URL: ${RDS_JDBC_URL:-jdbc:h2:mem:notificationdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
      NOTIFICATION_DB_USERNAME: ${RDS_USERNAME:-sa}
      NOTIFICATION_DB_PASSWORD: ${RDS_PASSWORD:-}
      NOTIFICATION_DB_DRIVER: ${RDS_DRIVER:-org.h2.Driver}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      RABBITMQ_ADDRESSES: rabbitmq:5672,rabbitmq-2:5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-cloudnative}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-cloudnative123}
    ports:
      - "8083:8083"

  rabbit-admin-service:
    build:
      context: ./backend/rabbit-admin-service
    container_name: rabbit-admin-service
    environment:
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE}
      RABBITMQ_ADDRESSES: rabbitmq:5672,rabbitmq-2:5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-cloudnative}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-cloudnative123}
    ports:
      - "8084:8084"

volumes:
  rabbitmq_node1_data:
  rabbitmq_node2_data:
