      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:-https://login.microsoftonline.com/94b15b07-9bad-4661-8554-aad0e62b18de/v2.0}
      JWT_AUDIENCES: ${JWT_AUDIENCES:-api://0f18b5b0-285b-4050-a959-245884ab7670,0f18b5b0-285b-4050-a959-245884ab7670}
